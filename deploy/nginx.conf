# Nginx server block for the MXR website.
# Set server_name and root to match the server, and keep any existing SSL settings.

server {
    listen 80;
    server_name mxr.ai;

    root /var/www/mxr/build;   # the uploaded contents of build/
    index index.html;

    # Keep redirects relative, so they stay on https behind a proxy
    absolute_redirect off;

    # /about.html -> /about, /index.html -> /
    # Tests $request_uri (what the visitor asked for), so internal lookups do not loop
    if ($request_uri ~ ^/index\.html(\?.*)?$) {
        return 301 /$1;
    }
    if ($request_uri ~ ^/([^?]+)\.html(\?.*)?$) {
        return 301 /$1$2;
    }

    # /about/ -> /about
    rewrite ^/([^/].*)/$ /$1 permanent;

    # /about serves about.html; unknown URLs fall back to the app's "Page not found"
    location / {
        try_files $uri $uri.html /index.html;
    }
}
